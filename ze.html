<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gerador de Stream Sem API</title>

<style>

body {

font-family: 'Segoe UI', Arial, sans-serif;

background-color: #121212;

color: #ffffff;

display: flex;

justify-content: center;

align-items: center;

height: 100vh;

margin: 0;

}

.card {

background-color: #1e1e1e;

padding: 30px;

border-radius: 12px;

box-shadow: 0 10px 30px rgba(0,0,0,0.5);

width: 100%;

max-width: 400px;

text-align: center;

}

h2 { color: #ff0000; margin-bottom: 25px; font-size: 24px; }

.input-group {

margin-bottom: 20px;

text-align: left;

}

label { font-size: 14px; color: #bbb; display: block; margin-bottom: 8px; }

input {

width: 100%;

padding: 12px;

border-radius: 6px;

border: 1px solid #333;

background-color: #2a2a2a;

color: white;

box-sizing: border-box;

font-size: 15px;

}

.btn {

display: block;

width: 100%;

padding: 12px;

margin: 10px 0;

border-radius: 6px;

border: none;

font-size: 16px;

font-weight: bold;

cursor: pointer;

text-decoration: none;

transition: background 0.2s;

box-sizing: border-box;

}

.btn-obs { background-color: #ff0000; color: white; }

.btn-obs:hover { background-color: #cc0000; }

.btn-webcam { background-color: #28a745; color: white; }

.btn-webcam:hover { background-color: #218838; }

.footer-note { font-size: 12px; color: #666; margin-top: 20px; }

</style>

</head>

<body>



<div class="card">

<h2>Gerador de Stream YouTube</h2>


<div class="input-group">

<label for="stream_title">Título Proposto para a Stream:</label>

<input type="text" id="stream_title" placeholder="Ex: Minha Live de Gameplay">

</div>



<!-- Links dinâmicos controlados pelo JS abaixo -->

<a href="#" id="link_obs" target="_blank" class="btn btn-obs">Abrir Dashboard (Para OBS)</a>

<a href="#" id="link_webcam" target="_blank" class="btn btn-webcam">Iniciar Stream via Webcam</a>



<p class="footer-note">Nota: Este painel não usa chaves de API. Ele redireciona diretamente para os estúdios de criação oficiais do YouTube.</p>

</div>



<script>

const inputTitulo = document.getElementById('stream_title');

const linkObs = document.getElementById('link_obs');

const linkWebcam = document.getElementById('link_webcam');



function atualizarLinks() {

const tituloCodificado = encodeURIComponent(inputTitulo.value);


// Link 1: Painel de Controlo clássico (onde obtém a Chave de Stream para o OBS)

linkObs.href = `https://youtube.com`;


// Link 2: Abre direto a interface de transmissão rápida da Webcam com o título predefinido

if(inputTitulo.value) {

linkWebcam.href = `https://youtube.com{tituloCodificado}`;

} else {

linkWebcam.href = `https://youtube.com`;

}

}



// Atualiza os links sempre que o utilizador digita algo

inputTitulo.addEventListener('input', atualizarLinks);


// Inicializa os links ao carregar a página

atualizarLinks();

</script>



</body>

</html>
