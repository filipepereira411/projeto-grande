<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Tudo-Em-Um</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { color: #333; margin-bottom: 5px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        input {
            width: 80%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #0056b3; }
        .db-status {
            margin-top: 20px;
            padding: 15px;
            background: #e9ecef;
            border-radius: 6px;
            font-size: 14px;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>O Meu Website</h1>
        <p>Este ecrã guarda dados numa base de dados simulada via código.</p>
        
        <!-- Formulário para enviar dados -->
        <input type="text" id="inputDado" placeholder="Escreve algo para guardar...">
        <br>
        <button id="btnGuardar">Guardar na Base de Dados</button>

        <!-- Parte que representa a Base de Dados no ecrã -->
        <div class="db-status">
            <strong>Visualizador da Base de Dados (Local):</strong>
            <ul id="listaDados">
                <!-- Os dados guardados vão aparecer aqui -->
            </ul>
        </div>
    </div>

    <script>
        // LÓGICA DA "BASE DE DADOS" (Usando o armazenamento do próprio navegador)
        const inputDado = document.getElementById('inputDado');
        const btnGuardar = document.getElementById('btnGuardar');
        const listaDados = document.getElementById('listaDados');

        // Função para carregar dados que já estavam guardados
        function carregarDados() {
            listaDados.innerHTML = "";
            // Simula ir buscar à base de dados (LocalStorage do browser)
            const dadosExistentes = JSON.parse(localStorage.getItem('minha_bd')) || [];
            
            dadosExistentes.forEach(item => {
                const li = document.createElement('li');
                li.textContent = item;
                listaDados.appendChild(li);
            });
        }

        // Função para guardar novos dados
        btnGuardar.addEventListener('click', () => {
            const texto = inputDado.value.trim();
            if (texto === "") return alert("Escreve algo primeiro!");

            // Ir buscar os dados antigos, adicionar o novo e salvar
            const dadosExistentes = JSON.parse(localStorage.getItem('minha_bd')) || [];
            dadosExistentes.push(texto);
            localStorage.setItem('minha_bd', JSON.stringify(dadosExistentes));

            // Limpar o input e atualizar o ecrã
            inputDado.value = "";
            carregarDados();
        });

        // Inicia a aplicação a mostrar o que está na "base de dados"
        carregarDados();
    </script>
</body>
</html>
